name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  # Runs tests/unit only (see vitest.config.ts). tests/integration is
  # excluded here because it hits a real database via DATABASE_URL, which
  # this job is not given — pointing it at the same DATABASE_URL_CI secret
  # the e2e job below uses is a future follow-up.
  #
  # Coverage threshold (CLAUDE.md's Testing section) is enforced over
  # lib/availability/**, lib/pricing/**, lib/content/** and lib/seo/** — the
  # domain and content logic the project owns — not the whole tree. Excluded:
  # lib/availability/hold.ts and the thin Prisma wrappers lib/content/tours.ts,
  # transfers.ts and blog.ts, each verified by an integration test instead
  # (tests/integration/) because their real behaviour is a database round-trip
  # that can't be meaningfully mocked. See docs/architecture.md, "Coverage gate
  # scope", for the full rationale.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # middleware.ts scopes clerkMiddleware to /admin only, so the public
  # routes smoke.spec.ts exercises have no Clerk dependency and need no
  # Clerk env vars here. tests/e2e/admin-auth.spec.ts (which does exercise
  # /admin) needs a real Clerk-hosted sign-in redirect, which requires real
  # credentials CI doesn't have, so it's skipped in CI (see
  # playwright.config.ts) — a real CLERK_SECRET_KEY /
  # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY GitHub Actions secret pair, plus
  # Clerk's official Playwright Testing Token setup, is a future follow-up.
  #
  # DATABASE_URL comes from the DATABASE_URL_CI repo secret, a dedicated
  # Neon branch (e.g. "ci", branched off dev) reserved for this job so e2e
  # runs don't collide with local dev seeding. Migrate + seed it before the
  # Next.js build so pages that query lib/content/** have real data to render.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
